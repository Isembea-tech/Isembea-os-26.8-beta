<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131d">
<meta name="description" content="Isembea OS 26.8 with ISEMBEA Weather and multi-provider ISEMBEA AI.">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Isembea OS 26.8</title>
<style>
:root{
 color-scheme:dark;
 --bg:#10131d;--panel:rgba(27,32,48,.78);--panel2:rgba(255,255,255,.075);
 --line:rgba(255,255,255,.13);--text:#f5f6ff;--muted:#aab1c7;
 --accent:#a8a1ff;--radius:26px;--blur:18px;
 --fast:150ms;--normal:280ms;--ease:cubic-bezier(.22,1,.36,1);
 font-family:Inter,system-ui,-apple-system,"Noto Sans Thai",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);user-select:none;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}
button{color:inherit;border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:11px 14px;cursor:pointer;transition:transform var(--fast) var(--ease),background var(--fast),border-color var(--fast)}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
input,textarea,select{color:var(--text);background:#171b2a;border:1px solid var(--line);border-radius:13px;padding:12px;width:100%;outline:none}
body.light input,body.light textarea,body.light select{color:#171a2b;background:#fff;border-color:#aeb5ca;color-scheme:light}
body.light input::placeholder,body.light textarea::placeholder{color:#737b91}
textarea{resize:vertical;min-height:110px}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:0 18px 60px #0003}
#wallpaper{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 18% 15%,#554a9b 0,transparent 35%),radial-gradient(ellipse at 85% 65%,#164d65 0,transparent 38%),linear-gradient(145deg,#10131d,#17192c 55%,#0d1823);transition:background .3s}
#wallpaper:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#ffffff08,transparent 45%,#0002)}
#status{height:34px;padding:7px 18px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:650;position:relative;z-index:8}
.status-right{display:flex;gap:8px;align-items:center}
#status button{padding:2px 7px;border:0;background:transparent;font-size:12px}
#screen{height:calc(100dvh - 64px);overflow:auto;position:relative;padding:12px 18px 24px;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
.home-head{display:flex;justify-content:space-between;align-items:center;margin:12px 0 18px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.8px;margin-top:2px}
.roundbtn{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:18px}
.widget{border-radius:var(--radius);padding:19px;margin:12px 0;background:linear-gradient(135deg,#ffffff17,#ffffff06);border:1px solid #ffffff19}
.clock{font-size:clamp(42px,12vw,64px);font-weight:650;letter-spacing:-2px;line-height:1.08}
.date{color:var(--muted);font-size:13px;margin-top:6px}
.widget-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.widget-title{font-size:12px;color:var(--muted);margin-bottom:6px}
.widget-value{font-size:20px;font-weight:700}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px}
.section-head h2{font-size:15px;margin:0}
.section-head span{font-size:12px;color:var(--muted)}
.app-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:19px 9px;padding:5px 0 20px}
@media(min-width:420px){.app-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(orientation:landscape) and (max-height:520px){#screen{height:calc(100dvh - 42px);max-width:900px}.widget{padding:12px;margin:8px 0}.clock{font-size:42px}.app-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.dock{height:56px}.dock .app-icon{width:38px;height:38px}}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;border:0;background:transparent;padding:0;animation:iconIn .42s var(--ease) both}
.app:nth-child(2){animation-delay:25ms}.app:nth-child(3){animation-delay:45ms}.app:nth-child(4){animation-delay:65ms}.app:nth-child(5){animation-delay:85ms}.app:nth-child(6){animation-delay:105ms}
.app-icon{width:clamp(48px,14vw,62px);height:clamp(48px,14vw,62px);border-radius:21px;display:grid;place-items:center;font-size:25px;background:var(--iconbg,#ffffff17);border:1px solid #ffffff19;box-shadow:inset 0 1px #ffffff20,0 8px 20px #0002}
.app-label{font-size:11px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:#f1f2ff}
.dock{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(92%,440px);height:67px;border-radius:25px;display:flex;align-items:center;justify-content:space-evenly;padding:7px;z-index:7}
.dock .app-icon{width:46px;height:46px;border-radius:17px;font-size:22px}
.dock .app-label{display:none}
#nav{position:fixed;bottom:0;left:0;right:0;height:5px;z-index:12;display:flex;justify-content:center;align-items:center;background:transparent}
#nav button{width:108px;height:4px;padding:0;border:0;border-radius:10px;background:#ffffffb0}
.page{min-height:100%;animation:pageIn var(--normal) var(--ease) both}
.page-top{display:flex;align-items:center;gap:12px;margin:5px 0 20px}
.page-top h1{font-size:24px;letter-spacing:-.5px;margin:0}
.back{width:42px;height:42px;padding:0;border-radius:50%;font-size:20px}
.card{border:1px solid var(--line);background:var(--panel2);border-radius:22px;padding:16px;margin:10px 0}
.card h3{font-size:15px;margin:0 0 7px}
.card p{font-size:13px;color:var(--muted);line-height:1.5;margin:4px 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff10}
.row:last-child{border-bottom:0}.row strong{font-size:14px}.row small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.switch{width:48px;height:28px;border-radius:20px;padding:3px;background:#ffffff22;flex-shrink:0}
.switch:after{content:"";display:block;width:20px;height:20px;background:white;border-radius:50%;transition:transform .2s}
.switch.on{background:var(--accent)}.switch.on:after{transform:translateX(20px)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.primary{background:var(--accent);color:#17152c;border-color:transparent;font-weight:700}
.muted{color:var(--muted);font-size:12px;line-height:1.55}
#shade{position:fixed;inset:0;z-index:20;display:none;align-items:flex-start;justify-content:center;padding:42px 12px 12px;background:#05071266}
#shade.show{display:flex;animation:fadeIn .16s ease both}
.shade-panel{width:min(100%,520px);max-height:calc(100dvh - 60px);overflow:auto;border-radius:30px;padding:20px;animation:panelIn var(--normal) var(--ease) both}
.shade-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.shade-head h2{font-size:20px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{text-align:left;min-height:72px;border-radius:20px;padding:14px}
.tile.active{background:color-mix(in srgb,var(--accent) 34%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.tile b{display:block;font-size:14px;margin-bottom:5px}.tile small{font-size:11px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,15px);opacity:0;pointer-events:none;z-index:40;background:#252a3b;border:1px solid var(--line);border-radius:16px;padding:11px 16px;font-size:13px;transition:opacity .2s,transform .2s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#boot{position:fixed;inset:0;z-index:100;background:#10131d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s,visibility .35s}
#boot.hide{opacity:0;visibility:hidden;pointer-events:none}
.boot-logo{width:82px;height:82px;border-radius:28px;display:grid;place-items:center;font-size:36px;font-weight:800;background:linear-gradient(135deg,var(--accent),#5cd5d5);color:#141527;box-shadow:0 0 55px #a8a1ff44}
.boot-name{font-weight:750;font-size:22px}.boot-sub{font-size:11px;color:var(--muted);letter-spacing:2px}
.loader{width:120px;height:3px;border-radius:5px;background:#ffffff16;overflow:hidden;margin-top:10px}
.loader:after{content:"";display:block;height:100%;width:40%;background:var(--accent);animation:load 1s ease-in-out infinite}
#lock{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:14vh 24px 8vh;text-align:center;background:linear-gradient(150deg,#25264aee,#10242fee),radial-gradient(ellipse at top,#7664bd,#10131d)}
#lock.show{display:flex;animation:fadeIn .25s ease both}
.lock-time{font-size:clamp(58px,18vw,88px);letter-spacing:-3px;font-weight:600}
.lock-date{color:#dddff4}.lock-bottom{width:100%;display:flex;justify-content:space-between;align-items:center}
#fileInput,
#restoreInput{display:none !important;position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;clip-path:inset(50%)}
body.light{--bg:#e8eaf5;--panel:rgba(255,255,255,.82);--panel2:rgba(25,35,70,.06);--line:rgba(30,40,70,.14);--text:#171a2b;--muted:#646b82}
body.light #wallpaper{background:radial-gradient(ellipse at 15% 15%,#c6c1ff,transparent 38%),radial-gradient(ellipse at 85% 70%,#b9e7ed,transparent 42%),linear-gradient(145deg,#edf0ff,#e7f7f7)}
body.light .app-label{color:#25283b}
body.high-contrast{--line:#ffffff70;--muted:#e4e6ff}
body.lite *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body.lite .app,body.lite .page,body.lite .shade-panel{animation-duration:.01ms!important}
body.debug-borders *{outline:1px dashed #ff6262!important}
.card, .widget, .dock, .shade-panel{background-color:var(--panel)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px) scale(.985);filter:blur(2px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes iconIn{from{opacity:0;transform:translateY(10px) scale(.88)}to{opacity:1;transform:none}}
@keyframes panelIn{from{opacity:0;transform:translateY(-18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media(min-width:700px){#screen{max-width:700px;margin:auto;padding-left:26px;padding-right:26px}.app-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:24px 16px}.widget{padding:24px}.dock{bottom:14px}}
/* Isembea Tune · Liquid Glass Music Suite */
.tune-wrap{padding-bottom:90px}.tune-hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;background:linear-gradient(135deg,rgba(167,153,255,.25),rgba(73,205,198,.12));border:1px solid var(--line);backdrop-filter:blur(var(--blur));margin-bottom:14px}.tune-brand{display:flex;align-items:center;gap:12px}.tune-logo{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;font-size:26px;background:linear-gradient(145deg,#b8aaff,#5bd7ca);color:#141627;box-shadow:0 8px 28px #8d8aff44}.tune-tabs{position:fixed;z-index:22;left:12px;right:12px;bottom:8px;max-width:520px;margin:auto;display:flex;justify-content:space-around;gap:5px;overflow:auto;padding:8px;background:rgba(22,22,38,.9);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(24px);box-shadow:0 8px 32px #0004}.tune-tabs button{white-space:nowrap;border-radius:999px}.tune-tabs button.active{background:var(--accent);color:#171525;border-color:transparent}.tune-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tune-track{min-width:0;border:1px solid var(--line);border-radius:18px;padding:10px;background:var(--glass,rgba(255,255,255,.055));backdrop-filter:blur(var(--blur))}.tune-cover{aspect-ratio:1/1;border-radius:13px;background:linear-gradient(145deg,#6e5cb7,#2a9c9c);display:grid;place-items:center;font-size:34px;overflow:hidden;margin-bottom:8px}.tune-cover img{width:100%;height:100%;object-fit:cover}.tune-track strong,.tune-track small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tune-track small{opacity:.65;margin:4px 0 8px}.tune-row{display:flex;gap:8px;align-items:center}.tune-row>*{min-width:0}.tune-input{width:100%;box-sizing:border-box;margin:5px 0 9px}.tune-player{padding:18px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(155deg,rgba(255,255,255,.10),rgba(120,110,180,.07));backdrop-filter:blur(var(--blur));text-align:center}.tune-bigcover{width:min(68vw,270px);aspect-ratio:1;margin:0 auto 18px;border-radius:24px;overflow:hidden;display:grid;place-items:center;font-size:72px;background:linear-gradient(145deg,#a59af5,#52c9c2);box-shadow:0 18px 45px #0002}.tune-bigcover img{width:100%;height:100%;object-fit:cover}.tune-controls{display:flex;justify-content:center;align-items:center;gap:12px;margin:14px 0}.tune-controls button{border-radius:50%;width:44px;height:44px;font-size:18px}.tune-controls .play{width:58px;height:58px;background:var(--accent);color:#161425;font-size:24px}.tune-range{width:100%;accent-color:var(--accent)}.tune-eq{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.tune-eq label{font-size:12px;text-align:center}.tune-eq input{writing-mode:vertical-lr;direction:rtl;height:100px;width:22px;display:block;margin:10px auto;accent-color:var(--accent)}.tune-visual{width:100%;height:86px;border-radius:15px;background:#151523;display:block}.tune-status{font-size:12px;opacity:.7;overflow-wrap:anywhere}.tune-modal{position:fixed;inset:0;z-index:80;background:#080812b8;display:grid;place-items:center;padding:18px}.tune-modal>div{width:min(100%,500px);max-height:85vh;overflow:auto;padding:18px;border-radius:24px;background:var(--panel,#222234);border:1px solid var(--line)}.tune-lyrics{white-space:pre-wrap;line-height:1.8;text-align:center;padding:18px;opacity:.85}.tune-source{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
@media(min-width:700px){.tune-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tune-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:16px}.tune-tabs{left:22px;right:auto;top:100px;bottom:20px;width:210px;max-width:210px;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}.tune-tabs button{text-align:left}.tune-wrap{margin-left:225px;padding-bottom:90px}}


/* ISEMBEA OS 26.8 feature modules */
.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.feature-item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:15px;background:var(--panel2)}
.feature-item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.feature-item small{display:block;color:var(--muted);margin-top:3px}
.feature-item button{padding:8px 10px}
.feature-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.calc-display{font-size:34px;text-align:right;padding:20px 12px;min-height:82px;overflow-wrap:anywhere}
.calc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.calc-grid button{min-height:54px;font-size:18px}
.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.gallery-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:13px}
.recorder-preview,.qr-preview{width:100%;border-radius:16px;background:#080b12;max-height:260px;object-fit:contain}

/* ===== Desktop & tablet mode: windowed apps, taskbar, top menu bar ===== */
.win-close{display:none}
@media (min-width:768px) and (min-height:560px){
 html,body{overflow:hidden}
 #status{position:fixed;top:0;left:0;right:0;height:30px;padding:6px 16px 0;z-index:15;background:#0b0e18a6;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
 body.light #status{background:#ffffffb3}
 #screen{position:fixed;top:30px;left:0;right:0;bottom:0;height:auto;max-width:1120px;margin:0 auto;padding:28px 40px 120px;overflow:auto}
 .app-grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:26px 14px}
 .app:hover .app-icon{transform:translateY(-3px);transition:transform var(--fast) var(--ease)}
 .widget{padding:22px}
 #nav{display:none}
 .dock{display:flex !important;bottom:12px;left:50%;transform:translateX(-50%);width:auto;max-width:calc(100% - 40px);padding:7px 14px;gap:10px;justify-content:center;height:64px}
 .dock .app-icon{width:46px;height:46px;border-radius:17px}
 .dock .app:hover .app-icon{transform:translateY(-4px)}
 #shade{align-items:flex-start;justify-content:flex-end;padding:44px 16px 0 0}
 .shade-panel{width:380px;max-height:calc(100dvh - 120px)}

 /* An open app becomes a floating window centred above the taskbar */
 body.app-open #screen{left:max(24px,calc(50% - 540px));right:auto;top:50px;bottom:96px;width:min(1080px,calc(100vw - 48px));max-width:none;margin:0;padding:18px 24px 24px;border-radius:24px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:0 30px 90px #0008;animation:panelIn var(--normal) var(--ease) both}
 body.app-open .win-close{display:grid;place-items:center;position:fixed;top:60px;right:calc(max(24px,50% - 540px) + 14px);width:30px;height:30px;padding:0;border-radius:50%;font-size:13px;z-index:9;background:#ff5f57;border-color:transparent;color:#2a0a08}
 body.app-open .win-close:hover{background:#ff3b30}
 body.app-open .page-top{margin-top:4px}
}

/* ISEMBEA AI */
.ai-shell{display:flex;flex-direction:column;gap:14px;max-width:920px;margin:0 auto;padding-bottom:24px}
.ai-hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:26px;padding:22px;background:linear-gradient(135deg,rgba(120,105,255,.22),rgba(50,170,190,.10)),var(--panel)}
.ai-hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-60px;top:-90px;background:rgba(155,145,255,.16);filter:blur(8px);pointer-events:none}
.ai-kicker{font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--accent);text-transform:uppercase}
.ai-hero h2{font-size:clamp(25px,5vw,38px);letter-spacing:-.04em;margin:8px 0}
.ai-hero p{max-width:580px;color:var(--muted);line-height:1.55;margin:0}
.ai-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ai-chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 11px;font-size:12px;color:var(--muted)}
.ai-panel{border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:15px;backdrop-filter:blur(var(--blur))}
.ai-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai-field label{display:block;font-size:11px;color:var(--muted);margin:0 0 6px 2px}
.ai-field input,.ai-field select,.ai-composer textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--text);padding:11px 12px;font:inherit;outline:none}
.ai-field input:focus,.ai-field select:focus,.ai-composer textarea:focus{border-color:var(--accent)}
.ai-field select option{background:#202438;color:#fff}
.ai-status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.ai-dot{width:7px;height:7px;border-radius:50%;background:#9298aa;display:inline-block}
.ai-dot.ready{background:#55d6a0;box-shadow:0 0 0 4px rgba(85,214,160,.12)}
.ai-chat{display:flex;flex-direction:column;gap:12px;min-height:230px;max-height:48vh;overflow:auto;padding:4px 2px}
.ai-empty{text-align:center;margin:auto;padding:30px 12px;color:var(--muted)}
.ai-empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.ai-message{max-width:min(88%,720px);padding:12px 14px;border-radius:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.ai-message.user{align-self:flex-end;background:linear-gradient(135deg,#7568d9,#4b78a8);color:white;border-bottom-right-radius:5px}
.ai-message.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:5px}
.ai-message.error{border-color:rgba(240,110,110,.5);color:#ffb5b5}
.ai-composer{display:flex;gap:9px;align-items:flex-end}
.ai-composer textarea{resize:vertical;min-height:48px;max-height:140px;flex:1}
.ai-send{min-width:48px;height:48px;border:0;border-radius:15px;background:var(--accent);color:#171629;font-size:20px;font-weight:800}
.ai-secondary{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:9px 12px}
.ai-small{font-size:11px;color:var(--muted);line-height:1.5}
.ai-settings{display:none;gap:10px;margin-top:12px}
.ai-settings.open{display:grid}
.ai-app-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;max-width:1100px;margin:0 auto;min-height:60vh}.ai-sidebar{border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:12px;overflow:auto}.ai-new{width:100%;padding:11px;border-radius:13px;background:var(--accent);color:#171629;border:0;font-weight:700}.ai-sidebar-label{font-size:10px;letter-spacing:.14em;color:var(--muted);margin:20px 7px 8px}.ai-history-item{display:block;width:100%;text-align:left;padding:10px;border:0;background:transparent;color:var(--muted);border-radius:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ai-history-item.active,.ai-history-item:hover{background:var(--panel);color:var(--text)}.ai-main{display:flex;flex-direction:column;min-width:0;gap:14px}.ai-main-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 2px 12px}.ai-main-head h2{font-size:22px;margin:3px 0}.ai-settings-button{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--text);font-size:19px}.ai-main .ai-chat{flex:1;min-height:280px;max-height:48vh}.ai-settings-page{max-width:760px;margin:0 auto;display:grid;gap:14px}.ai-settings-intro h2{font-size:27px;margin:6px 0}.ai-settings-intro p{color:var(--muted);margin:0 0 8px}.ai-panel h3{margin:0 0 14px}.ai-settings-actions{display:flex;justify-content:flex-end;gap:9px}.ai-settings-actions .primary{border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:#171629;font-weight:700}
@media(max-width:700px){.ai-app-layout{grid-template-columns:1fr}.ai-sidebar{max-height:125px}.ai-sidebar-label{margin-top:10px}.ai-history-item{display:inline-block;width:auto;max-width:180px}.ai-main .ai-chat{max-height:42vh}}
@media(max-width:560px){.ai-row{grid-template-columns:1fr}.ai-message{max-width:94%}.ai-panel{padding:12px}.ai-hero{padding:18px}}

function freshDefaults(){return JSON.parse(JSON.stringify(defaultState))}
function loadState(){
 try {
 const current = localStorage.getItem(STORE);
 const legacy = current ? null : localStorage.getItem(LEGACY_STORE);
 const saved = JSON.parse(current || legacy || "{}");
 const loaded = {...freshDefaults(),...saved};
 if(!current && legacy) { try { localStorage.setItem(STORE, JSON.stringify(loaded)); } catch(e) {} }
  loaded.customNotifications = Array.isArray(loaded.customNotifications) ? loaded.customNotifications : [];
 loaded.language = loaded.language === "th" ? "th" : "en";
 loaded.apps = Array.isArray(loaded.apps) ? loaded.apps : [];
 loaded.notes = String(loaded.notes || "");
 loaded.installedApps = Array.isArray(loaded.installedApps) ? loaded.installedApps : defaultState.installedApps.slice();
 for(const k of ["tasks","contacts","gallery","calendarEvents","recentActivities","clipboardHistory","notificationRules","workspacePins"])if(!Array.isArray(loaded[k]))loaded[k]=freshDefaults()[k];
 return loaded;
 } catch(e) { try{const raw=localStorage.getItem(STORE);if(raw)localStorage.setItem(STORE+"-corrupt-"+Date.now(),raw)}catch(_){} return freshDefaults(); }
}
function saveState(){
 try { localStorage.setItem(STORE, JSON.stringify(state)); }
 catch(e) { toast("บันทึกไม่สำเร็จ พื้นที่จัดเก็บอาจเต็ม"); }
}
function pushNotification(title,message,appId="home"){
 if(!state.notifications) return;
 const text=(String(title)+" "+String(message)).toLowerCase();
 if((state.notificationRules||[]).some(r=>r.enabled&&r.keyword&&text.includes(r.keyword.toLowerCase())))return;
 state.customNotifications.unshift({id:Date.now()+Math.random(),title:String(title),message:String(message),appId,createdAt:new Date().toISOString(),read:false});
 state.customNotifications=state.customNotifications.slice(0,50);
 saveState();
}
function openNotification(appId){closeShade();if(!appId||appId==="home")goHome();else openApp(appId);}
function escapeHTML(value){
 return String(value).replace(/[&<>"']/g, c => ({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function applyState(){
 document.body.classList.toggle("light",state.theme==="light");
 document.body.classList.toggle("lite",state.motion==="lite"||state.motion==="saver"||tune.theme.motion==="reduced");
 document.body.classList.toggle("high-contrast",!!state.highContrast);
 document.documentElement.style.setProperty("--accent",state.accent);
 document.documentElement.style.setProperty("--blur",state.blur+"px");
 document.documentElement.style.setProperty("--panel-alpha",String(Math.max(0.25,Math.min(1,(Number(state.glassIntensity)||78)/100))));
 document.documentElement.style.setProperty("--panel",`rgba(27,32,48,${Math.max(.25,Math.min(1,(Number(state.glassIntensity)||78)/100))})`);
 document.documentElement.style.setProperty("--screen-brightness",Math.max(0.25,Math.min(1,Number(state.brightness||100)/100)));
 $("screen").style.filter=Number(state.brightness||100)>=100?"none":`brightness(${Math.max(0.25,Math.min(1,Number(state.brightness)/100))})`;
 $("wallpaper").style.background = wallpaperBackground(state.wallpaper);
 $("fpsBadge").style.display=state.fpsOverlay?"block":"none";
}
function wallpaperBackground(index){
 const options = [
 "radial-gradient(ellipse at 18% 15%,#554a9b 0,transparent 35%),radial-gradient(ellipse at 85% 65%,#164d65 0,transparent 38%),linear-gradient(145deg,#10131d,#17192c 55%,#0d1823)",

function timeText(){
 return new Intl.DateTimeFormat(getLocale(),{hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());
}
function updateClock(){
 const now = new Date();
 $("statusTime").textContent = timeText();
 const date = new Intl.DateTimeFormat(getLocale(),{weekday:"long",day:"numeric",month:"long"}).format(now);
 $("lockTime").textContent = timeText();
 $("lockDate").textContent = date;
 const clockPage = $("clockPageTime");
 if(clockPage){clockPage.textContent = timeText();const cd=$("clockPageDate");if(cd)cd.textContent=new Intl.DateTimeFormat(getLocale(),{dateStyle:"full"}).format(now);}
 const homeClock = $("homeClock");
 if(homeClock) homeClock.textContent = timeText();
 const homeDate = $("homeDate");
 if(homeDate) homeDate.textContent = date;
}
function toast(message){
 const node=$("toast");
 node.textContent=message;
 node.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>node.classList.remove("show"),2200);
}
function iconButton(app, compact=false){
 const safeId=String(app?.id??"");
 if(!/^[a-zA-Z0-9_-]{1,64}$/.test(safeId))return "";
 return `<button class="app" onclick="openApp('${safeId}')" aria-label="${escapeHTML(app.name)}">
 <span class="app-icon" style="--iconbg:${app.color||"#514a91"}">${app.icon||"◇"}</span>
 <span class="app-label">${escapeHTML(app.name)}</span>
 </button>`;
}

function pageShell(title,content){
 return `<section class="page"><header class="page-top"><h1>${title}</h1></header>${content}</section>`;
}
function leaveAppCleanup(next){
 if(currentApp==="tune"&&next!=="tune")tuneStopYT();
 if(currentApp==="qr"&&next!=="qr")stopQRScan();
 if(currentApp==="recorder"&&next!=="recorder"){if(mediaRecorder?.state==="recording")stopScreenRecording();else recorderStream?.getTracks().forEach(t=>t.stop())}
}
function openApp(id, push=true){leaveAppCleanup(id);
 if(id==="ai-settings"){if(push&&currentApp!=="home"&&currentApp!==id)historyStack.push(currentApp);previousApp=currentApp;currentApp=id;$ ("dock").style.display="none";renderAISettings();return;}
 const app=allApps().find(a=>a.id===id);
 if(!app){toast("ไม่พบแอปนี้");return;}
state.recentActivities=[{id,name:app.name,at:Date.now()},...(state.recentActivities||[]).filter(x=>x.id!==id)].slice(0,12);saveState();
 if(push && currentApp!=="home" && currentApp!==id) historyStack.push(currentApp);
 previousApp=currentApp;
 currentApp=id;
 
 $("dock").style.display="none";
 if(app.custom){
 const item=state.apps.find(a=>a.id===id);
 if(!item){toast("ไม่พบแอปที่นำเข้า");goHome();return;}
 $("screen").innerHTML=pageShell(escapeHTML(item.name),
 `<div class="card"><p>แอป HTML ที่นำเข้า</p><iframe title="${escapeHTML(item.name)}" sandbox="allow-scripts" referrerpolicy="no-referrer" style="width:100%;height:65vh;border:1px solid var(--line);border-radius:16px;background:white" srcdoc="${escapeHTML(item.source)}"></iframe></div>`);
 return;
 }
 switch(id){
 case "clock": renderClock(); break;
 case "notes": renderNotes(); break;
 case "calendar": renderCalendar(); break;
 case "weather": renderWeather(); break;
 case "settings": renderSettings(); break;
 case "files": renderFiles(); break;
 case "search": renderSearch(); break;
 case "manager": renderManager(); break;
 case "diagnostics": renderDiagnostics(); break;
 case "monitor": renderMonitor(); break;
 case "store": renderStore(); break;
 case "terminal": renderTerminal(); break;
 case "developer": renderDeveloper(); break;
 case "changelog": renderChangelog(); break;
 case "tune": renderTune(); break;
 case "about": renderAbout(); break;
 case "assistant": renderAssistant(); break;
 case "ai-settings": renderAISettings(); break;
 case "recorder": renderRecorder(); break;
 case "calculator": renderCalculator(); break;
 case "gallery": renderGallery(); break;
 case "contacts": renderContacts(); break;
 case "tasks": renderTasks(); break;
 case "qr": renderQRScanner(); break;
 case "clipboard": renderClipboard(); break;
 case "permissions": renderPermissions(); break;
 case "workspace": renderWorkspace(); break;
 case "activity": renderActivity(); break;
 case "converter": renderConverter(); break;
 case "notification-rules": renderNotificationRules(); break;
 default: goHome();
 }
 applyLanguage();
}
function goHome(){leaveAppCleanup("home");
 historyStack=[];
 renderHome();
 $("dock").style.display="flex";
}
function goBack(){
 if($("shade").classList.contains("show")){closeShade();return;}
 if($("lock").classList.contains("show")){unlock();return;}
 const previous=historyStack.pop();
 if(previous && previous!=="home") openApp(previous,false);
 else goHome();
}
function renderClock(){
 $("screen").innerHTML=pageShell("นาฬิกา",`
 <div class="card"><div class="widget-title">เวลาปัจจุบัน</div><div class="clock" id="clockPageTime">--:--</div><div class="date" id="clockPageDate"></div></div>
 <div class="card"><h3>ตัวจับเวลา</h3><div class="widget-value" id="timerValue">00:00</div><div class="actions"><button class="primary" onclick="startTimer()">เริ่ม 1 นาที</button><button onclick="stopTimer()">หยุด</button></div></div>`);

 $("clockPageTime").textContent=timeText();

let timerHandle=null,timerEnd=0;
function startTimer(){if(timerHandle)clearInterval(timerHandle);timerHandle=null;timerEnd=Date.now()+60000;const tick=()=>{const left=Math.max(0,timerEnd-Date.now());const value=$("timerValue");if(value)value.textContent=String(Math.floor(left/60000)).padStart(2,"0")+":"+String(Math.floor(left/1000)%60).padStart(2,"0");if(left<=0){clearInterval(timerHandle);timerHandle=null;toast("หมดเวลาแล้ว");}};tick();timerHandle=setInterval(tick,250);toast("เริ่มจับเวลา 1 นาที")}
function stopTimer(){if(timerHandle)clearInterval(timerHandle);timerHandle=null;const value=$("timerValue");if(value)value.textContent="หยุดแล้ว"}

function localDateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function renderCalendar(){
 const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1),days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
 let cells="";for(let i=0;i<first.getDay();i++)cells+="<span></span>";
 for(let d=1;d<=days;d++)cells+=`<button style="padding:9px 0;border-radius:12px;${d===now.getDate()?"background:var(--accent);color:#17152c;font-weight:800":""}" onclick="calendarSelectDay(${d})">${d}</button>`;
 const selected=window.calendarSelectedDay||now.getDate(),dateKey=localDateKey(new Date(now.getFullYear(),now.getMonth(),selected));
 const events=(state.calendarEvents||[]).filter(x=>x.date===dateKey);
 $("screen").innerHTML=pageShell("Calendar",`<div class="card"><h3>${new Intl.DateTimeFormat(getLocale(),{month:"long",year:"numeric"}).format(now)}</h3><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px;color:var(--muted);margin:14px 0 8px">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<span>${x}</span>`).join("")}</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center">${cells}</div></div><div class="card"><h3>Events · ${dateKey}</h3><input id="calendarEventTitle" placeholder="Event title"><div class="feature-actions"><button class="primary" onclick="calendarAddEvent('${dateKey}')">Add event</button></div>${events.map(x=>`<div class="feature-item"><div class="grow"><strong>${escapeHTML(x.title)}</strong></div><button onclick="calendarDeleteEvent('${x.id}')">Delete</button></div>`).join("")||'<p class="muted">No events for this date.</p>'}</div><p class="muted">Calendar events are saved locally in this browser.</p>`);
}
function calendarSelectDay(day){window.calendarSelectedDay=day;renderCalendar()}
function calendarAddEvent(date){const title=$("calendarEventTitle")?.value.trim();if(!title)return toast("Enter an event title");state.calendarEvents=state.calendarEvents||[];state.calendarEvents.push({id:"event-"+Date.now(),title,date});saveState();renderCalendar();toast("Event saved")}
function calendarDeleteEvent(id){state.calendarEvents=(state.calendarEvents||[]).filter(x=>x.id!==id);saveState();renderCalendar()}

const WEATHER_STORE_KEY="isembea-weather-storage-v1";
function weatherShim(html){
 let init={};try{init=JSON.parse(localStorage.getItem(WEATHER_STORE_KEY)||"{}")||{}}catch(_){init={}}
 const data=JSON.stringify(init).replace(/</g,"\\u003c");
 const shim='<script>(function(){const m=new Map(Object.entries('+data+'));function sync(){try{parent.postMessage({isembeaWeatherStorage:Object.fromEntries(m)},"*")}catch(e){}}const s={getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v));sync()},removeItem:k=>{m.delete(String(k));sync()},clear:()=>{m.clear();sync()},key:i=>[...m.keys()][i]??null,get length(){return m.size}};try{void window.localStorage.length}catch(e){Object.defineProperty(window,"localStorage",{value:s,configurable:true})}})();<\/script>';
 return html.replace(/<head[^>]*>/i,m=>m+shim);
}
window.addEventListener("message",e=>{const f=$("weatherFrame");if(!f||e.source!==f.contentWindow||!e.data||!e.data.isembeaWeatherStorage)return;try{localStorage.setItem(WEATHER_STORE_KEY,JSON.stringify(e.data.isembeaWeatherStorage))}catch(_){}});
function renderWeather(){
 $("screen").innerHTML=pageShell("ISEMBEA Weather",`<iframe id="weatherFrame" title="ISEMBEA Weather" allow="geolocation" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox" referrerpolicy="strict-origin-when-cross-origin" style="display:block;width:100%;height:calc(100dvh - 112px);min-height:620px;border:0;border-radius:24px;background:transparent"></iframe>`);
 const frame=$("weatherFrame");
 try{
  const binary=atob(WEATHER_APP_B64);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  frame.srcdoc=weatherShim(new TextDecoder().decode(bytes));
 }catch(error){
  frame.srcdoc='<p style="font-family:sans-serif;padding:20px">Could not load ISEMBEA Weather.</p>';
  console.error("ISEMBEA Weather:",error);
 }
}

function importHTML(event){
 const file=event.target.files&&event.target.files[0];if(!file)return;
 if(file.size>2*1024*1024){toast("ไฟล์ใหญ่เกิน 2 MB");event.target.value="";return}
 const reader=new FileReader();
 reader.onload=()=>{
 const name=file.name.replace(/\.(html?|HTML?)$/,"")||"HTML App";
 const id="custom-"+Date.now();
 state.apps.push({id,name,source:String(reader.result)});
 saveState();event.target.value="";toast("นำเข้าแอปแล้ว");openApp("manager",false);
 };
 reader.onerror=()=>toast("อ่านไฟล์ไม่สำเร็จ");
 reader.readAsText(file);
}

 $("searchBox").focus();

function searchResults(query){
 const target=$("searchResults");if(!target)return;
 const q=query.trim().toLowerCase();
 if(!q){target.innerHTML='<p class="muted">ลองค้นหา เช่น โน้ต การตั้งค่า หรือปฏิทิน</p>';return}
 const matches=allApps().filter(a=>(localizedAppName(a.name)+" "+a.name+" "+a.id).toLowerCase().includes(q));
 const taskMatches=(state.tasks||[]).filter(x=>x.title.toLowerCase().includes(q));
 const contactMatches=(state.contacts||[]).filter(x=>(x.name+" "+x.detail).toLowerCase().includes(q));
 const settingItems=[{name:"ธีม",terms:"theme dark light",app:"settings"},{name:"วอลเปเปอร์",terms:"wallpaper background",app:"settings"},{name:"ความสว่าง",terms:"brightness display",app:"settings"},{name:"การแจ้งเตือน",terms:"notification",app:"settings"},{name:"สำรองข้อมูล",terms:"backup restore",app:"files"},{name:"App Store",terms:"store install mini apps",app:"store"},{name:"Developer Options",terms:"developer debug",app:"developer"},{name:"Terminal",terms:"terminal shell commands",app:"terminal"},{name:"Changelog",terms:"version release history",app:"changelog"}].filter(x=>(x.name+" "+x.terms).toLowerCase().includes(q));
 const appHtml=matches.map(a=>`<button style="width:100%;text-align:left;margin:4px 0" onclick="openApp('${a.id}')">${a.icon||"⌘"}　${escapeHTML(localizedAppName(a.name))}　›</button>`).join("");
 const settingHtml=settingItems.map(x=>`<button style="width:100%;text-align:left;margin:4px 0" onclick="openApp('${x.app}')">⚙　${escapeHTML(x.name)}　›</button>`).join("");
 const localHtml=[...taskMatches.map(x=>`<div class="feature-item"><div class="grow"><strong>${escapeHTML(x.title)}</strong><small>Task · ${x.done?"Done":"Open"}</small></div></div>`),...contactMatches.map(x=>`<div class="feature-item"><div class="grow"><strong>${escapeHTML(x.name)}</strong><small>Contact · ${escapeHTML(x.detail)}</small></div></div>`)].join("");
 target.innerHTML=(appHtml||settingHtml||localHtml)?`<h3>Apps</h3>${appHtml||'<p class="muted">No app match</p>'}<h3>Settings & commands</h3>${settingHtml||'<p class="muted">No match</p>'}<h3>Local data</h3>${localHtml||'<p class="muted">No local match</p>'}`:'<p class="muted">No results</p>';
}

function runDiagnostics(){
 const checks=[["App Registry",Array.isArray(allApps())&&allApps().length>0],["LocalStorage",(()=>{try{localStorage.setItem("isembea-test","1");localStorage.removeItem("isembea-test");return true}catch(e){return false}})()],["Navigation",typeof openApp==="function"&&typeof goBack==="function"],["Notification Engine",Array.isArray(state.customNotifications)],["Theme State",!!state.theme]];
 const out=$("diagnosticResults");if(out)out.innerHTML=checks.map(([name,ok])=>diagnosticRow(name,ok?"ผ่าน":"ไม่ผ่าน")).join("");
 toast("ทดสอบระบบแล้ว: "+checks.filter(x=>x[1]).length+"/"+checks.length+" รายการผ่าน");
}

const ISEMBEA_AI_DEFAULTS = {
 mode:"backend",
 endpoint:"",
 apiKey:"",
 provider:"gemini",
 model:"gemini-2.5-flash",

function aiGetConfig(){
 try{return {...ISEMBEA_AI_DEFAULTS,...JSON.parse(localStorage.getItem("isembea-ai-config")||"{}")};}
 catch(_){return {...ISEMBEA_AI_DEFAULTS};}
}
function aiSaveConfig(){
 const old=aiGetConfig();
 const mode=$("aiConnectionMode")?.value||old.mode||"backend";
 const endpoint=$("aiEndpoint")?.value.trim()||"";
 const apiKey=$("aiApiKey")?.value.trim()||"";
 const provider=$("aiProvider")?.value||old.provider;
 const model=$("aiModel")?.value.trim()||old.model;
 const systemPrompt=$("aiSystemPrompt")?.value.trim()||ISEMBEA_AI_DEFAULTS.systemPrompt;
 const temperature=Number($("aiTemperature")?.value??old.temperature);
 const cfg={...old,mode,endpoint,apiKey,provider,model,systemPrompt,temperature};
 localStorage.setItem("isembea-ai-config",JSON.stringify(cfg));
 const ready=mode==="backend"?!!endpoint:!!apiKey;
 aiSetStatus(mode==="backend"?(endpoint?"Backend URL saved.":"Add your Backend URL to connect."):(apiKey?"Direct API key saved on this device.":"Add your provider API key to connect."),ready);
 toast("ISEMBEA AI settings saved");
}
function aiConnectionModeChanged(){
 const mode=$("aiConnectionMode")?.value||"backend";
 const backend=$("aiBackendFields"),direct=$("aiDirectFields");
 if(backend)backend.style.display=mode==="backend"?"block":"none";
 if(direct)direct.style.display=mode==="direct"?"block":"none";
}
function aiProviderChanged(){
 const p=$("aiProvider")?.value||"gemini";
 const defaults={gemini:"gemini-2.5-flash",openai:"gpt-4.1-mini",groq:"llama-3.3-70b-versatile"};
 if($("aiModel"))$("aiModel").value=defaults[p]||"";
}
function aiLoadHistory(){try{return JSON.parse(localStorage.getItem("isembea-ai-history")||"[]")}catch(_){return []}}
function aiPersist(id,msgs){
 if(!id)return;
 const all=aiLoadHistory();const idx=all.findIndex(c=>c.id===id);
 const firstUser=(msgs||[]).find(m=>m.role==="user");
 const autoTitle=firstUser?String(firstUser.content).replace(/\s+/g," ").trim().slice(0,40):"New chat";
 if(idx>=0){const cur=all[idx];all[idx]={...cur,messages:msgs||[],updated:Date.now(),title:cur.title&&cur.title!=="New chat"?cur.title:autoTitle}}
 else all.unshift({id,title:autoTitle,messages:msgs||[],updated:Date.now()});
 localStorage.setItem("isembea-ai-history",JSON.stringify(all.slice(0,50)));
}
function aiSaveHistory(){aiPersist(window.__isembeaAiCurrent,window.__isembeaAiMessages)}
function aiNewChat(){
 const id="chat-"+Date.now();window.__isembeaAiCurrent=id;window.__isembeaAiMessages=[];
 const all=aiLoadHistory();all.unshift({id,title:"New chat",messages:[],updated:Date.now()});
 localStorage.setItem("isembea-ai-history",JSON.stringify(all.slice(0,50)));renderAssistant();
}

async function aiSend(){
  const input=$("aiPrompt"),send=$("aiSend");
  const prompt=(input?.value||"").trim();if(!prompt)return;
  const cfg=aiGetConfig();
  const mode=cfg.mode||"backend";
  if(mode==="backend"&&!cfg.endpoint){aiSetStatus("Backend URL is not configured.",false);aiAddMessage("assistant","Open AI Settings and enter your Backend URL, or switch to Direct API.","error");return;}
  if(mode==="direct"&&!cfg.apiKey){aiSetStatus("Provider API key is not configured.",false);aiAddMessage("assistant","Open AI Settings and add your provider API key for Direct API.","error");return;}
  if(mode==="backend"&&!/^https:\/\/|^http:\/\/localhost(?::\d+)?/i.test(cfg.endpoint)){aiAddMessage("assistant","Use an HTTPS backend URL (localhost is allowed for development).","error");return;}
  const chatId=window.__isembeaAiCurrent||(window.__isembeaAiCurrent="chat-"+Date.now());
  const messages=window.__isembeaAiMessages||(window.__isembeaAiMessages=[]);
  const isVisible=()=>window.__isembeaAiCurrent===chatId&&!!$("aiChat");
  messages.push({role:"user",content:prompt});
  aiPersist(chatId,messages);
  aiAddMessage("user",prompt);if(input){input.value="";input.disabled=true}if(send)send.disabled=true;
  const pending=aiAddMessage("assistant","Thinking…");
  aiSetStatus(mode==="backend"?"Connecting through ISEMBEA Backend…":"Connecting directly to "+cfg.provider.toUpperCase()+"…",false);
  try{
   let response,data,answer;
   if(mode==="backend"){
    response=await fetch(cfg.endpoint.replace(/\/+$/,"")+"/v1/chat/completions",{
     method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({provider:cfg.provider,model:cfg.model,messages:[{role:"system",content:cfg.systemPrompt},...messages],temperature:Number(cfg.temperature)||0.7})
    });
    data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error((typeof data.error==="string"?data.error:data.error?.message)||`Backend error ${response.status}`);
    answer=data.choices?.[0]?.message?.content||data.output_text||data.response;
   }else if(cfg.provider==="gemini"){
    const contents=messages.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
    response=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(cfg.model)+":generateContent?key="+encodeURIComponent(cfg.apiKey),{
     method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({systemInstruction:{parts:[{text:cfg.systemPrompt}]},contents,generationConfig:{temperature:Number(cfg.temperature)||0.7}})
    });
    data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error?.message||`Gemini API error ${response.status}`);
    answer=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("").trim();
   }else{
    const apiUrl=cfg.provider==="groq"?"https://api.groq.com/openai/v1/chat/completions":"https://api.openai.com/v1/chat/completions";
    response=await fetch(apiUrl,{
     method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.apiKey},
     body:JSON.stringify({model:cfg.model,messages:[{role:"system",content:cfg.systemPrompt},...messages],temperature:Number(cfg.temperature)||0.7})
    });
    data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error?.message||`${cfg.provider.toUpperCase()} API error ${response.status}`);
    answer=data.choices?.[0]?.message?.content;
   }
   if(!answer)throw new Error("The provider returned an empty response.");
   messages.push({role:"assistant",content:answer});
   aiPersist(chatId,messages);
   if(isVisible()){if(pending)pending.textContent=answer;aiRenderHistory();aiSetStatus("Connected · "+cfg.provider.toUpperCase()+" · "+(mode==="backend"?"Backend Proxy":"Direct API"),true)}
  }catch(error){
   if(messages.length&&messages[messages.length-1].role==="user")messages.pop();
   aiPersist(chatId,messages);
   if(isVisible()){if(pending){pending.classList.add("error");pending.textContent="Connection failed: "+error.message}aiSetStatus("Connection unavailable",false)}
  }finally{
   if(input)input.disabled=false;if(send)send.disabled=false;if(isVisible())input?.focus();
  }
}

function renderCalculator(){
 $("screen").innerHTML=pageShell("Calculator",`<div class="card"><input id="calcDisplay" class="calc-display" value="0" readonly><div class="calc-grid">${["AC","⌫","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","±","0",".","="].map(k=>`<button class="${k==="="?"primary":""}" onclick="calcPress('${k}')">${k}</button>`).join("")}</div></div>`);
}
let calcExpression="";
function calcPress(k){
 const out=$("calcDisplay");if(!out)return;
 if(k==="AC"){calcExpression="";out.value="0";return}
 if(k==="⌫"){calcExpression=calcExpression.slice(0,-1);out.value=calcExpression||"0";return}
 if(k==="±"){const m=calcExpression.match(/(^|[+\-*/%(])(-?)(\d+\.?\d*|\.\d+)$/);if(m){const idx=calcExpression.length-m[0].length+m[1].length;calcExpression=calcExpression.slice(0,idx)+(m[2]?"":"-")+m[3]}out.value=calcExpression||"0";return}
 if(k==="="){
  try{const tokens=calcExpression.match(/(?:\d+\.?\d*|\.\d+)|[()+\-*/%]/g)||[];if(tokens.join("")!==calcExpression)throw 0;let i=0;
   function expr(){let v=term();while(tokens[i]==="+"||tokens[i]==="-"){let op=tokens[i++],b=term();v=op==="+"?v+b:v-b}return v}
   function term(){let v=factor();while(["*","/","%"].includes(tokens[i])){let op=tokens[i++],b=factor();if((op==="/"||op==="%")&&b===0)throw 0;v=op==="*"?v*b:op==="/"?v/b:v%b}return v}
   function factor(){if(tokens[i]==="-"){i++;return-factor()}if(tokens[i]==="("){i++;let v=expr();if(tokens[i++]!==")")throw 0;return v}let n=Number(tokens[i++]);if(!Number.isFinite(n))throw 0;return n}
   let n=expr();if(i!==tokens.length||!Number.isFinite(n))throw 0;calcExpression=String(Number(n.toPrecision(12)));out.value=calcExpression;
  }catch(e){out.value="Error";calcExpression=""}return;
 }
 calcExpression+=({"÷":"/","×":"*","−":"-"}[k]||k);out.value=calcExpression;
}

async function galleryImport(e){
 const files=[...(e.target.files||[])].filter(f=>f.type.startsWith("image/")).slice(0,8);
 if(e.target)e.target.value="";
if(!files.length)return toast("Choose image files");
 for(const file of files){
  try{
   const bitmap=await createImageBitmap(file),scale=Math.min(1,1200/Math.max(bitmap.width,bitmap.height));
   const canvas=document.createElement("canvas");canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);
   canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();
   const data=canvas.toDataURL("image/jpeg",.68);if(data.length>420000)continue;
   state.gallery.unshift({id:"img-"+Date.now()+"-"+Math.random().toString(36).slice(2),name:file.name,data});
   state.gallery=state.gallery.slice(0,8);
  }catch(err){}
 }
 try{saveState();renderGallery();toast("Gallery updated")}catch(err){toast("Storage is full. Remove older images and try again")}
}

let recorderStream=null,mediaRecorder=null,recordedChunks=[];
async function startScreenRecording(){if(!navigator.mediaDevices?.getDisplayMedia||!window.MediaRecorder)return toast("Screen capture is not supported");if(mediaRecorder?.state==="recording")return toast("Already recording");try{recorderStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});const preview=$("recorderPreview");if(preview)preview.srcObject=recorderStream;recordedChunks=[];const rec=new MediaRecorder(recorderStream);mediaRecorder=rec;rec.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};rec.onstop=()=>{const blob=new Blob(recordedChunks,{type:rec.mimeType||"video/webm"});recorderStream?.getTracks().forEach(t=>t.stop());recorderStream=null;const a=$("recordingDownload");if(a){a.href=URL.createObjectURL(blob);a.hidden=false;a.textContent="Save recording · "+Math.round(blob.size/1024)+" KB"}const st=$("recorderStatus");if(st)st.textContent="Recording ready"};recorderStream.getVideoTracks()[0]?.addEventListener("ended",()=>{if(rec.state==="recording")rec.stop()});rec.start();const st=$("recorderStatus");if(st)st.textContent="Recording…"}catch(e){toast("Capture failed: "+e.message)}}
function stopScreenRecording(){if(mediaRecorder?.state==="recording")mediaRecorder.stop();else toast("No active recording")}

let qrStream=null,qrTimer=null;
async function startQRScan(){if(!("BarcodeDetector"in window))return toast("QR detection unavailable in this browser");try{let detector=new BarcodeDetector({formats:["qr_code"]});qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});let v=$("qrVideo");v.srcObject=qrStream;await v.play();qrTimer=setInterval(async()=>{if(!v.videoWidth)return;try{let codes=await detector.detect(v);if(codes.length){$("qrResult").textContent=codes[0].rawValue;stopQRScan()}}catch(e){}},500)}catch(e){toast("Camera unavailable: "+e.message)}}
function stopQRScan(){if(qrTimer)clearInterval(qrTimer);qrTimer=null;qrStream?.getTracks().forEach(t=>t.stop());qrStream=null}

async function readClipboard(){try{$("clipInput").value=await navigator.clipboard.readText()}catch(e){toast("Clipboard permission unavailable")}}
async function copyClip(id){let x=state.clipboardHistory.find(c=>c.id===id);if(!x)return;try{await navigator.clipboard.writeText(x.text);toast("Copied")}catch(e){toast("Copy permission unavailable")}}
function deleteClip(id){state.clipboardHistory=state.clipboardHistory.filter(x=>x.id!==id);saveState();renderClipboard()}
async function renderPermissions(){$("screen").innerHTML=pageShell("Permissions Center",`<div class="card"><h3>Browser permissions</h3><p>These permissions apply to this website only. They do not change Android system permissions.</p>${["notifications","location","camera","microphone"].map(x=>`<div class="feature-item"><div class="grow"><strong>${x}</strong><small id="perm-${x}">Permission not checked</small></div><button onclick="requestPermission('${x}')">Request</button></div>`).join("")}</div>`);for(let x of ["notifications","geolocation","camera","microphone"]){try{let s=await navigator.permissions?.query({name:x});let el=$("perm-"+(x==="geolocation"?"location":x));if(s&&el)el.textContent="Status: "+s.state}catch(e){}}}
async function requestPermission(x){try{if(x==="notifications"){let v=await Notification.requestPermission();$("perm-notifications").textContent="Status: "+v;return}if(x==="location"){await new Promise((a,b)=>navigator.geolocation.getCurrentPosition(a,b,{timeout:10000}));$("perm-location").textContent="Granted";return}let s=await navigator.mediaDevices.getUserMedia({video:x==="camera",audio:x==="microphone"});s.getTracks().forEach(t=>t.stop());$("perm-"+x).textContent="Granted"}catch(e){toast("Permission unavailable: "+e.message)}}
function renderWorkspace(){let pins=state.workspacePins||[];$("screen").innerHTML=pageShell("Smart Workspace",`<div class="card"><h2>Workspace overview</h2><p>${(state.tasks||[]).filter(x=>!x.done).length} open tasks · ${(state.contacts||[]).length} contacts · ${(state.customNotifications||[]).length} notifications</p></div><div class="card"><h3>Pinned apps</h3><div class="feature-grid">${pins.map(id=>{let a=allApps().find(x=>x.id===id);return a?`<button onclick="openApp('${id}')">${a.icon}<br>${escapeHTML(a.name)}</button>`:""}).join("")}</div></div><div class="card"><h3>Manage pins</h3>${allApps().map(a=>`<div class="row"><strong>${escapeHTML(a.name)}</strong><input type="checkbox" style="width:20px" ${pins.includes(a.id)?"checked":""} onchange="toggleWorkspacePin('${a.id}',this.checked)"></div>`).join("")}</div>`)}
function toggleWorkspacePin(id,on){state.workspacePins=on?[...new Set([...(state.workspacePins||[]),id])]:(state.workspacePins||[]).filter(x=>x!==id);saveState();renderWorkspace()}

function renderConverter(){$("screen").innerHTML=pageShell("Unit Converter",`<div class="card"><h3>Length converter</h3><input id="convertValue" type="number" value="1" oninput="convertUnits()"><div class="feature-actions"><select id="convertFrom" onchange="convertUnits()"><option value="m">Meters</option><option value="km">Kilometers</option><option value="cm">Centimeters</option><option value="mi">Miles</option><option value="ft">Feet</option></select><select id="convertTo" onchange="convertUnits()"><option value="km">Kilometers</option><option value="m">Meters</option><option value="cm">Centimeters</option><option value="mi">Miles</option><option value="ft">Feet</option></select></div><h2 id="convertResult">0.001 km</h2></div>`);convertUnits()}
function convertUnits(){let f={m:1,km:1000,cm:.01,mi:1609.344,ft:.3048},v=Number($("convertValue")?.value||0),a=$("convertFrom")?.value||"m",b=$("convertTo")?.value||"km";let n=v*f[a]/f[b];if($("convertResult"))$("convertResult").textContent=Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:8})+" "+b:"Invalid value"}

function getLocale(){return state.language==="th"?"th-TH":"en-US"}
function t(value){if(state.language==="th")return translations[value]||value;return Object.entries(translations).find(([en,th])=>th===value)?.[0]||value}
function applyLanguage(){
 document.documentElement.lang=state.language==="th"?"th":"en";
 const toThai=state.language==="th";
 const map=new Map(Object.entries(translations).map(([en,th])=>toThai?[en,th]:[th,en]).filter(([from])=>from));
 const keys=[...map.keys()].sort((a,b)=>b.length-a.length);
 const re=keys.length?new RegExp(keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g"):null;
 const swap=text=>re?String(text).replace(re,m=>map.get(m)):text;
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){const v=swap(node.nodeValue);if(v!==node.nodeValue)node.nodeValue=v}
 document.querySelectorAll("#screen input, #screen button, #screen select, #screen textarea").forEach(el=>{for(const key of ["placeholder","aria-label","title"]){if(el.hasAttribute(key))el.setAttribute(key,swap(el.getAttribute(key)))}});
}

function tuneApplyPreset(name){tune.preset=name;const presets={Balanced:[0,0,0,0,0],Bass:[8,5,1,0,-1],Vocal:[-2,1,5,4,1],Custom:tune.eq};tune.eq=presets[name].slice();tuneEnsureAudioGraph();tune.eq.forEach((v,i)=>{tuneApplyBand(i)});tuneSave();tuneRenderTab()}
function tuneEnsureAudioGraph(){const a=$('tuneAudio');if(!a||tune.audioCtx)return;try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;tune.audioCtx=new Ctx();if(tune.audioCtx.state==='suspended')tune.audioCtx.resume().catch(()=>{});tune.sourceNode=tune.audioCtx.createMediaElementSource(a);const freqs=[60,250,1000,4000,12000];tune.filters=freqs.map((f,i)=>{const n=tune.audioCtx.createBiquadFilter();n.type=i===0?'lowshelf':i===4?'highshelf':'peaking';n.frequency.value=f;n.Q.value=1;n.gain.value=0;return n});tune.filters.forEach((_,i)=>tuneApplyBand(i));tune.analyser=tune.audioCtx.createAnalyser();tune.analyser.fftSize=128;let node=tune.sourceNode;tune.filters.forEach(f=>{node.connect(f);node=f});node.connect(tune.analyser);tune.analyser.connect(tune.audioCtx.destination)}catch(e){console.warn('Audio graph unavailable',e)}}
function tuneApplyBand(i){if(!tune.filters?.[i])return;tune.filters[i].gain.value=(Number(tune.eq[i])||0)+(i===0?(Number(tune.bass)||0):0)}
function tuneSetBass(v){tune.bass=Math.max(0,Math.min(12,Number(v)||0));tuneApplyBand(0);tuneSave()}
function tuneSetEQ(i,v){tune.eq[i]=Number(v);tuneEnsureAudioGraph();tuneApplyBand(i);tune.preset='Custom';tuneSave()}
function tuneDrawVisualizer(){const canvas=$('tuneViz');if(!canvas)return;const ctx=canvas.getContext('2d');let tick=0;const draw=()=>{if(!canvas.isConnected)return;const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#151523';ctx.fillRect(0,0,w,h);let data;if(tune.analyser&&tune.source==='local'){data=new Uint8Array(tune.analyser.frequencyBinCount);tune.analyser.getByteFrequencyData(data)}else{data=Array.from({length:40},(_,i)=>40+Math.abs(Math.sin(tick*.045+i*.45))*100)}const count=Math.min(48,data.length);const bw=w/count;for(let i=0;i<count;i++){const v=data[i]/255;const bh=Math.max(3,v*h*.86);const grad=ctx.createLinearGradient(0,h-bh,0,h);grad.addColorStop(0,'#6fe4d0');grad.addColorStop(1,tune.theme.accent);ctx.fillStyle=grad;ctx.fillRect(i*bw+2,h-bh,Math.max(1,bw-4),bh)}tick++;tune.raf=requestAnimationFrame(draw)};cancelAnimationFrame(tune.raf||0);draw()}
function tuneEditLyrics(){const v=prompt('Add lyrics or notes you have permission to use:',tune.lyrics);if(v===null)return;tune.lyrics=v;tuneSave();tuneRenderTab()}
function tuneSetSleep(){let mode=$('tuneSleepMode')?.value||'off';const unsupportedEnd=mode==='end'&&tune.source==='youtube';if(unsupportedEnd)mode='off';tune.sleepMode=mode;if(tune.timer)clearInterval(tune.timer);if(mode==='timer'){const mins=Number($('tuneSleepMinutes')?.value||30);tune.sleepAt=Date.now()+mins*60000;tune.timer=setInterval(()=>{if(Date.now()>=tune.sleepAt){tuneStopPlayback();clearInterval(tune.timer);tune.timer=null;tune.sleepMode='off';tuneSave();tuneRenderTab()}else{const el=$('tuneSleepCountdown');if(el)el.textContent=tuneSleepText()}},1000)}else if(mode==='end'){tune.sleepAt=0;tune.timer=null}else{tune.sleepAt=0;tune.timer=null}tuneSave();tuneRenderTab();toast(unsupportedEnd?'Stop at end of track is available for local audio only':mode==='off'?'Sleep timer off':mode==='end'?'Will stop at end of track':'Sleep timer started')}
function tuneSleepText(){if(tune.sleepMode==='end')return'At end of track';if(tune.sleepMode==='timer'&&tune.sleepAt){const left=Math.max(0,tune.sleepAt-Date.now());return `${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')} remaining`}return'Off'}
function tuneStopPlayback(){const a=$('tuneAudio');if(a)a.pause();if(tune.source==='youtube')tunePostYT('pauseVideo');tune.playing=false;tuneRenderMini();if(tune.tab==='player')tuneRenderTab()}
function tuneLogHistory(title,source){tune.history=tune.history||[];tune.history.unshift({title,source,at:Date.now()});tune.history=tune.history.slice(0,30);tuneSave()}
function tuneClearHistory(){tune.history=[];tuneSave();tuneRenderTab();toast('Play history cleared')}
function tuneExportLibrary(){const data={format:'IsembeaTuneLibrary',version:1,exportedAt:new Date().toISOString(),tracks:tune.tracks.map(({id,title,artist,album,duration,size,mime,cover,addedAt})=>({id,title,artist,album,duration,size,mime,cover,addedAt}))};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='isembea-tune-library.json';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
if(!state.calendarDateFixed){
 if((state.calendarEvents||[]).length&&new Date().getTimezoneOffset()<0){
  state.calendarEvents=state.calendarEvents.map(e=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(e.date||"");if(!m)return e;const d=new Date(+m[1],+m[2]-1,+m[3]+1);return {...e,date:localDateKey(d)}});
 }
 state.calendarDateFixed=true;saveState();
}

 const sync=()=>document.body.classList.toggle("app-open",currentApp!=="home");
 for(const name of ["openApp","goHome","renderHome"]){
  const orig=window[name];
  window[name]=function(...a){const r=orig.apply(this,a);sync();return r};
 }
 sync();

setTimeout(()=>$("boot").classList.add("hide"),1150);
